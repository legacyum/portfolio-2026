name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build single-file bundle
        run: node tests/build-dist.js
      - name: Run E2E test suite
        run: node tests/run-e2e-tests.js
      - name: Run adversarial stress tests
        run: node tests/adversarial-stress-tests.js
      - name: Run preview server security tests
        run: node tests/server-security-tests.js
      - name: Run Three.js PropertyBinding security tests
        run: node tests/three-property-binding-security-tests.js
