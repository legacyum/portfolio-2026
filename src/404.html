<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d110e" />
  <meta name="robots" content="noindex, follow" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <title>404 | Alessandro Altamirano</title>
</head>
<body class="error-body">
  <main class="error-page" id="content">
    <a class="error-brand" href="/" aria-label="Volver al inicio de Alessandro Altamirano">
      <span class="error-brand-mark" aria-hidden="true">A</span>
      <span>ALTAMIRANO<span>.SYS</span></span>
    </a>

    <section class="error-panel" aria-labelledby="error-title">
      <p class="eyebrow">$ route_check --status</p>
      <p class="error-code" aria-hidden="true">404</p>
      <h1 id="error-title">Ruta no<br><em>encontrada.</em></h1>
      <p class="error-message">La dirección solicitada no existe o fue movida. El portafolio sigue operativo.</p>
      <div class="error-actions">
        <a class="button primary" href="/"><span>volver al inicio</span><span aria-hidden="true">←</span></a>
        <a class="button ghost" href="mailto:alessandro.altamirano23@gmail.com"><span>contactar</span><span aria-hidden="true">↗</span></a>
      </div>
      <p class="error-status"><span class="dot" aria-hidden="true"></span>SISTEMA DISPONIBLE · LIMA, PERÚ</p>
    </section>
  </main>
</body>
</html>
